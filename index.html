<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mesto</title>

  <script type="module" crossorigin src="./assets/index-c23823f0.js"></script>
  <link rel="stylesheet" href="./assets/index-e1840a2c.css">
</head>
<body class="page">
  <div class="page__content">
    <header class="header page__section">
      <p class="logo header__logo">Mesto<span class="header__logo-country">Russia</span></p>
    </header>

    <main class="content">
      <section class="profile page__section">
        <div class="profile__image-container">
          <img src="" alt="Аватар пользователя" class="profile__image">
          <div class="profile__image-overlay">
            <img src="./assets/edit-icon-4b5dd474.svg" alt="Редактировать аватар" class="profile__image-edit-icon">
          </div>
        </div>
        <div class="profile__info">
          <h1 class="profile__title"></h1>
          <button class="profile__edit-button" type="button" aria-label="Редактировать профиль"></button>
          <p class="profile__description"></p>
        </div>
        <button class="profile__add-button" type="button" aria-label="Добавить место"></button>
      </section>

      <section class="places page__section">
        <ul class="places__list"></ul>
      </section>
    </main>

    <footer class="footer page__section">
      <p class="footer__copyright">© 2026 Mesto Russia</p>
    </footer>
  </div>

  <!-- Модальное окно редактирования профиля -->
  <div class="popup popup_type_edit">
    <div class="popup__content">
      <button type="button" class="popup__close" aria-label="Закрыть"></button>
      <h3 class="popup__title">Редактировать профиль</h3>
      <form class="popup__form" name="edit-profile" novalidate>
        <input
          type="text"
          name="name"
          id="name-input"
          class="popup__input popup__input_type_name"
          placeholder="Имя"
          required
          minlength="2"
          maxlength="40"
          pattern="^[a-zA-Zа-яА-ЯёЁ\\s\\-]+$"
          data-error-message="Разрешены только латинские, кириллические буквы, знаки дефиса и пробелы"
        >
        <span class="name-input-error popup__input-error"></span>
        <input
          type="text"
          name="description"
          id="description-input"
          class="popup__input popup__input_type_description"
          placeholder="О себе"
          required
          minlength="2"
          maxlength="200"
        >
        <span class="description-input-error popup__input-error"></span>
        <button type="submit" class="button popup__button popup__button_disabled" disabled>Сохранить</button>
      </form>
    </div>
  </div>

  <!-- Модальное окно добавления карточки -->
  <div class="popup popup_type_new-card">
    <div class="popup__content">
      <button type="button" class="popup__close" aria-label="Закрыть"></button>
      <h3 class="popup__title">Новое место</h3>
      <form class="popup__form" name="new-place" novalidate>
        <input
          type="text"
          name="place-name"
          id="place-name-input"
          class="popup__input popup__input_type_card-name"
          placeholder="Название"
          required
          minlength="2"
          maxlength="30"
          pattern="^[a-zA-Zа-яА-ЯёЁ\\s\\-]+$"
          data-error-message="Разрешены только латинские, кириллические буквы, знаки дефиса и пробелы"
        >
        <span class="place-name-input-error popup__input-error"></span>
        <input
          type="url"
          name="link"
          id="link-input"
          class="popup__input popup__input_type_url"
          placeholder="Ссылка на картинку"
          required
        >
        <span class="link-input-error popup__input-error"></span>
        <button type="submit" class="button popup__button popup__button_disabled" disabled>Создать</button>
      </form>
    </div>
  </div>

  <!-- Модальное окно просмотра изображения -->
  <div class="popup popup_type_image">
    <div class="popup__content popup__content_content_image">
      <button type="button" class="popup__close" aria-label="Закрыть"></button>
      <img src="" alt="" class="popup__image">
      <p class="popup__caption"></p>
    </div>
  </div>

  <!-- Модальное окно обновления аватара -->
  <div class="popup popup_type_avatar">
    <div class="popup__content">
      <button type="button" class="popup__close" aria-label="Закрыть"></button>
      <h3 class="popup__title">Обновить аватар</h3>
      <form class="popup__form" name="update-avatar" novalidate>
        <input
          type="url"
          name="avatar"
          id="avatar-input"
          class="popup__input popup__input_type_avatar"
          placeholder="Ссылка на аватар"
          required
        >
        <span class="avatar-input-error popup__input-error"></span>
        <button type="submit" class="button popup__button popup__button_disabled" disabled>Сохранить</button>
      </form>
    </div>
  </div>

  <!-- Модальное окно подтверждения удаления -->
  <div class="popup popup_type_remove-card">
    <div class="popup__content popup__content_confirm">
      <button type="button" class="popup__close" aria-label="Закрыть"></button>
      <h3 class="popup__title">Вы уверены?</h3>
      <button type="button" class="button popup__button popup__button_confirm">Да</button>
    </div>
  </div>

  <!-- Модальное окно информации о карточке -->
  <div class="popup popup_type_info">
    <div class="popup__content popup__content_info">
      <button type="button" class="popup__close" aria-label="Закрыть"></button>
      <h3 class="popup__title">Информация о карточке</h3>
      <dl class="popup-info__list"></dl>
      <p class="popup-info__liked-title">Лайкнули:</p>
      <ul class="popup-info__users-list"></ul>
    </div>
  </div>

  <!-- Шаблон строки информации о карточке -->
  <template id="popup-info-definition-template">
    <div class="popup-info__row">
      <dt class="popup-info__term"></dt>
      <dd class="popup-info__definition"></dd>
    </div>
  </template>

  <!-- Шаблон пользователя, лайкнувшего карточку -->
  <template id="popup-info-user-preview-template">
    <li class="popup-info__user"></li>
  </template>

  <!-- Шаблон карточки -->
  <template id="card-template">
    <li class="places__item card">
      <img src="" alt="" class="card__image">
      <button type="button" class="card__control-button card__control-button_type_info" aria-label="Информация о карточке">i</button>
      <button type="button" class="card__delete-button" aria-label="Удалить карточку"></button>
      <div class="card__description">
        <h2 class="card__title"></h2>
        <div class="card__like-container">
          <button type="button" class="card__like-button" aria-label="Поставить лайк"></button>
          <span class="card__like-count">0</span>
        </div>
      </div>
    </li>
  </template>

  
</body>
</html>
